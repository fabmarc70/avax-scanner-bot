services:
  - type: web
    name: avax-scanner-bot
    env: python
    buildCommand: pip install -r render_requirements.txt
    startCommand: python render_bot.py
    plan: free
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_ID  
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
    autoDeploy: false
    healthCheckPath: /health